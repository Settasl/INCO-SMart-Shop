<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="yellowLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff566" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Yellow Rounded App Icon Tile -->
  <rect width="512" height="512" rx="120" fill="#e8fe00" />
  
  <g filter="url(#subtleShadow)">
    <!-- 3D Isometric Box perched on 'i' dot -->
    <!-- Top Lid (Yellow) -->
    <polygon points="172,130 220,154 172,178 124,154" fill="url(#yellowLid)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    <!-- Left Dark Face -->
    <polygon points="124,156 172,180 172,232 124,208" fill="url(#boxLeft)" stroke="#374151" stroke-width="3" stroke-linejoin="round" />
    <!-- Right Dark Face -->
    <polygon points="172,180 220,156 220,208 172,232" fill="url(#boxRight)" stroke="#374151" stroke-width="3" stroke-linejoin="round" />
    <!-- Yellow Checkmark on Right Face -->
    <path d="M 183 196 L 195 210 L 211 184" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 'inco' Wordmark (Bold Charcoal Heavy Sans) -->
    <!-- 'i' Stem -->
    <rect x="150" y="244" width="44" height="110" rx="12" fill="#18181b" />
    
    <!-- 'n' -->
    <path d="M 216 244 L 216 354 L 258 354 L 258 290 C 258 262 284 256 302 262 L 302 354 L 344 354 L 344 280 C 344 240 310 236 276 242 L 260 244 L 258 244 Z" fill="#18181b" />
    
    <!-- 'c' -->
    <path d="M 436 270 C 420 248 392 240 366 250 C 330 264 322 300 326 332 C 332 358 360 364 386 360 C 414 356 432 340 440 328 L 410 306 C 404 316 392 324 378 322 C 362 320 358 306 360 294 C 362 278 376 272 390 274 C 402 276 412 284 416 292 Z" fill="#18181b" />
    
    <!-- 'o' -->
    <path d="M 480 300 C 480 266 454 244 424 244 C 394 244 368 266 368 300 C 368 334 394 356 424 356 C 454 356 480 334 480 300 Z M 436 300 C 436 316 430 324 424 324 C 418 324 412 316 412 300 C 412 284 418 276 424 276 C 430 276 436 284 436 300 Z" fill="#18181b" />
  </g>
</svg>
