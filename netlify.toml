[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# Netlify Serverless Functions API routes
[[redirects]]
  from = "/api/ai/parse-text"
  to = "/.netlify/functions/ai-parse-text"
  status = 200

[[redirects]]
  from = "/api/ai/voice-dialogue"
  to = "/.netlify/functions/ai-voice-dialogue"
  status = 200

[[redirects]]
  from = "/api/ai/photo-audit"
  to = "/.netlify/functions/ai-photo-audit"
  status = 200

[[redirects]]
  from = "/api/ai/insights"
  to = "/.netlify/functions/ai-insights"
  status = 200

[[redirects]]
  from = "/api/send-email-alert"
  to = "/.netlify/functions/send-email-alert"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/users/*"
  to = "/.netlify/functions/users"
  status = 200

[[redirects]]
  from = "/api/users"
  to = "/.netlify/functions/users"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service Worker must never be aggressively cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Web App Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Static assets with long-term immutable caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security & Mobile Compatibility headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
