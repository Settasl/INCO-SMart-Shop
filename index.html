<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e131f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="INCO Smart Shop" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="description" content="Fast, high-density inventory counter, smart stock management, batch operations, POS, and sales tracking for kiosk owners and provision stores." />
    <meta property="og:title" content="INCO Smart Shop" />
    <meta property="og:description" content="Fast, high-density inventory counter, smart stock management, batch operations, POS, and sales tracking for kiosk owners and provision stores." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>INCO Smart Shop</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-yellow-400 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Resilient Service Worker registration for Apple Safari and modern browsers
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              // Check for SW updates
              registration.update().catch(() => {});
            })
            .catch((err) => {
              console.log('SW registration note:', err);
            });
        });
      }
    </script>
  </body>
</html>
