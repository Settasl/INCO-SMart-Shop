<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filter for slight crispness and depth -->
    <filter id="incoCubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Official INCO Brand Yellow Squircle Tile (#E5F107) -->
  <rect width="512" height="512" rx="120" fill="#E5F107" />

  <!-- Center Group: Mathematically and Optically Centered -->
  <g transform="translate(-4, 18)">
    <!-- 3D Isometric Cube perched above 'i' -->
    <g filter="url(#incoCubeShadow)">
      <!-- Top Face (Brand Yellow with #252525 Border) -->
      <polygon
        points="108,124 144,144 108,164 72,144"
        fill="#E5F107"
        stroke="#252525"
        stroke-width="5"
        stroke-linejoin="round"
      />
      <!-- Left #252525 Face -->
      <polygon
        points="72,144 108,164 108,210 72,190"
        fill="#252525"
        stroke="#252525"
        stroke-width="2"
        stroke-linejoin="round"
      />
      <!-- Right #252525 Face -->
      <polygon
        points="108,164 144,144 144,190 108,210"
        fill="#252525"
        stroke="#252525"
        stroke-width="2"
        stroke-linejoin="round"
      />
      <!-- Signature Brand Yellow Checkmark on Right Face (#E5F107) -->
      <path
        d="M 115 186 L 125 196 L 138 170"
        fill="none"
        stroke="#E5F107"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- Letter 'i' Stem in #252525 -->
    <rect
      x="93"
      y="226"
      width="30"
      height="114"
      rx="14"
      fill="#252525"
    />

    <!-- Letter 'n' in #252525 -->
    <path
      d="M 152 340 L 152 238 M 152 266 C 152 236 172 224 196 224 C 220 224 240 238 240 268 L 240 340"
      fill="none"
      stroke="#252525"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter 'c' in #252525 -->
    <path
      d="M 344 254 C 331 236 313 224 288 224 C 253 224 233 252 233 282 C 233 314 253 340 288 340 C 313 340 331 328 344 310"
      fill="none"
      stroke="#252525"
      stroke-width="30"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Letter 'o' in #252525 -->
    <circle
      cx="410"
      cy="282"
      r="44"
      fill="none"
      stroke="#252525"
      stroke-width="30"
    />
  </g>
</svg>